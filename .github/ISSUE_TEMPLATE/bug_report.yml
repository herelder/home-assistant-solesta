name: Bug report
description: Report reproducible unexpected behaviour in the Solesta integration.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include passwords, cookies, tokens, addresses, system IDs,
        private network details, unredacted diagnostics or Home Assistant databases.
  - type: input
    id: integration-version
    attributes:
      label: Solesta integration version
      placeholder: 0.2.3
    validations:
      required: true
  - type: input
    id: home-assistant-version
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Setup or authentication
        - Entities or updates
        - Dashboard card
        - Weekly archives
        - Diagnostics
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: sanitized-information
    attributes:
      label: Sanitized diagnostics or log excerpt
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, system identifiers and private network information.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
