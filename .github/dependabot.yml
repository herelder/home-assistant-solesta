version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
