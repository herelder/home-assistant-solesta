# Copy to secrets.yaml beside solesta-nanoc6.yaml. Never commit secrets.yaml.
esphome_name: "solesta-nanoc6-example"
friendly_name: "Solesta NanoC6"
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
api_encryption_key: "GENERATE_A_UNIQUE_32_BYTE_BASE64_KEY"

# false disables MQTT at boot; true enables it when broker details are filled in.
mqtt_enabled: false
mqtt_broker: ""
mqtt_port: 1883
mqtt_username: ""
mqtt_password: ""
mqtt_topic_prefix: "solesta/YOUR_DEVICE_ID"
